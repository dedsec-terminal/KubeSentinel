apiVersion: v1
kind: Pod
metadata:
  name: fail-non-root-pod
  namespace: edge-pune
  labels:
    app: fail-non-root
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: kubesentinel-edge-api:0.2.0
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
