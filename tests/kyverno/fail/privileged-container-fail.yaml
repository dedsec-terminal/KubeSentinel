apiVersion: v1
kind: Pod
metadata:
  name: fail-privileged-pod
  namespace: edge-pune
  labels:
    app: fail-privileged
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: kubesentinel-edge-api:0.2.0
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
