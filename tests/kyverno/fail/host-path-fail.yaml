apiVersion: v1
kind: Pod
metadata:
  name: fail-host-path-pod
  namespace: edge-pune
  labels:
    app: fail-host-path
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: host-volume
      hostPath:
        path: /etc
  containers:
    - name: workload
      image: kubesentinel-edge-api:0.2.0
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: host-volume
          mountPath: /mnt/host
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
