# KubeSentinel Redis Server Configuration — Milestone B
# Bound to all interfaces inside container namespace; not exposed to host.
bind 0.0.0.0
port 6379
protected-mode yes

# External ACL file location
aclfile /etc/redis/users.acl

# In-memory streaming broker settings (ephemeral stream buffer, no disk persistence)
save ""
appendonly no

# Memory limits & eviction policy
maxmemory 256mb
maxmemory-policy noeviction
