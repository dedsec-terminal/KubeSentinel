id: kubesentinel-falco-unexpected-shell
name: Unexpected Shell Execution in Edge Workload
description: Detects interactive or command-line shell process spawning within KubeSentinel edge workload containers (edge-pune, edge-mumbai, edge-bangalore) as alerted by the Falco runtime syscall engine.
severity: high
status: validated
index: kubesentinel-falco-*
language: lucene
query: 'rule:"Unexpected shell in KubeSentinel edge workload" AND output_fields.k8s_ns_name.keyword:("edge-pune" OR "edge-mumbai" OR "edge-bangalore")'
required_fields:
  - rule
  - output_fields.k8s_ns_name
  - output_fields.proc_cmdline
  - output_fields.k8s_pod_name
  - output_fields.container_name
mitre_attack:
  - tactic: execution
    technique_id: T1059.004
    technique_name: "Command and Scripting Interpreter: Unix Shell"
hypothesis: >
  An adversary attempting remote code execution, container breakout, or unauthorized
  diagnostic access within edge workloads will spawn an interactive or one-shot shell
  (e.g. /bin/sh, bash) inside edge-api or edge-worker containers.
investigation_guide: |
  1. Identify the pod and namespace from output_fields.k8s_pod_name and output_fields.k8s_ns_name.
  2. Inspect the exact command executed via output_fields.proc_cmdline. Check for simulation markers, recon commands, or interactive sessions.
  3. Determine the initiating user and UID via output_fields.user_name and output_fields.user_uid (standard non-root UID is 10001).
  4. Correlate with Kubernetes API audit logs or cluster activity to verify if an authorized kubectl exec session was initiated.
  5. Check network connections established by the container around the time of the event via output_fields.fd_name.
false_positives:
  - Authorized administrative diagnostics conducted via kubectl exec during active incident triage.
  - Deployment pre-start scripts or ephemeral container diagnostics in non-production environments.
limitations: >
  Does not detect direct execution of compiled native binaries if invoked without a shell
  wrapper. Relies on Falco modern eBPF probe and Fluent Bit forwarding pipeline availability.
