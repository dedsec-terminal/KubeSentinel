id: kubesentinel-falco-runtime-alerts-general
name: Falco Runtime Security Alerts General Hunt
description: Broad hunting query across all cluster namespaces and workloads to detect elevated runtime security alerts (Warning, Error, Critical) generated by the Falco modern eBPF driver.
severity: medium
status: hunting
index: kubesentinel-falco-*
language: lucene
query: 'priority:(Warning OR Error OR Critical OR Alert OR Emergency)'
required_fields:
  - priority
  - rule
  - output
  - source
hypothesis: >
  Elevated-priority Falco events can surface several kinds of suspicious or policy-relevant
  runtime behavior. This broad hunt spans heterogeneous Falco rules and therefore intentionally
  has no single MITRE ATT&CK mapping; analysts map a technique only after narrowing the result
  to a specific rule and behavior.
investigation_guide: |
  1. Group results by rule and priority to identify the distribution of alert types across the cluster.
  2. Filter by output_fields.k8s_ns_name to isolate affected namespaces.
  3. Inspect output_fields.proc_cmdline and output_fields.proc_name for unusual process hierarchies.
  4. Review output text for human-readable alert context generated by Falco.
  5. Check if the alerted behavior matches known maintenance activities or new deployment rollouts.
false_positives:
  - System maintenance scripts or container lifecycle hooks running in privileged or system namespaces.
  - Testing and validation suites triggering benign alerts.
limitations: >
  Broad hunting scope may capture heterogeneous alert types across disparate tactics.
  Requires contextual pivot by namespace, workload, or specific Falco rule rather than treating
  all matches as definitive proof of single-technique execution.
