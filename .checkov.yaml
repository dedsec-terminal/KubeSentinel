# .checkov.yaml - KubeSentinel Checkov Infrastructure-as-Code Configuration
# ==============================================================================
# This configuration defines scanning parameters and narrowly scoped exceptions
# for third-party security agents (Falco), log collectors (Fluent Bit), and
# intentional negative admission test fixtures in KubeSentinel.
# ==============================================================================

# General execution options
compact: true
quiet: false
soft-fail: false

# Directories and frameworks to scan
directory:
  - kubernetes
  - apps
  - .github/workflows
  - helm

framework:
  - kubernetes
  - dockerfile
  - github_actions
  - helm

# Skip intentional negative test fixtures that MUST fail admission to prove security controls
skip-path:
  - "kubernetes/security/psa-negative-pod.yaml" # Intentional negative fixture verifying Pod Security Standards rejection
  - "kubernetes/security-agents/falco/rendered-falco.yaml" # Generated upstream Falco manifest; exceptions are documented in .trivyignore and falco-runtime-security.md
  - "tests/kyverno/pass"                      # Unit-test fixture, not a deployable workload
  - "tests/kyverno/fail"                         # Intentional negative fixtures verifying Kyverno admission rejection
  - "simulations/insecure_deployment/fixtures"   # Intentional insecure workload fixture for Scenario 4 simulation

# Narrowly scoped check exceptions:
# The following checks are skipped for third-party telemetry and security daemons
# (Falco eBPF sensor in 'security-agents' and Fluent Bit in 'observability').
# All KubeSentinel application workloads (edge-api, edge-worker, redis) maintain
# 100% compliance with restricted Pod Security Standards.
skip-check:
  # --- Falco modern eBPF Security Agent Exceptions ---
  - CKV_K8S_16 # Container should not run with privileged flag (Falco modern_ebpf driver requires kernel tracepoint access)
  - CKV_K8S_17 # hostPath volume mounted (Falco requires /proc, /etc, containerd.sock for event enrichment)
  - CKV_K8S_37 # Container capabilities should drop ALL (Falco eBPF requires CAP_SYS_ADMIN/CAP_BPF)
  - CKV_K8S_20 # Containers should not run with allowPrivilegeEscalation (Falco daemonset)
  - CKV_K8S_22 # Container should run with read-only root filesystem (Falco dynamic rule compilation)
  - CKV_K8S_40 # Container should run as non-root user (Falco host eBPF probe requires root)
  - CKV_K8S_31 # Ensure hostPID is not set to true (Falco thread correlation requires host PID mapping)
  - CKV_K8S_19 # Container should not have hostNetwork set to true (Falco network connection tracking)
  - CKV_K8S_28 # Minimise admission of containers with NET_RAW capability (Third-party Helm chart default)

  # --- Fluent Bit Telemetry Collector Exceptions ---
  - CKV_K8S_38 # Ensure Service Account Tokens are only mounted where necessary (Helm chart default)

  # --- Tag and Digest Policies in Local Development Lab ---
  - CKV_K8S_14 # Image should use digest (Using pinned immutable version tags like :1.0.0 and :7.4.2-alpine in local lab)
  - CKV_K8S_43 # Image tag should not be latest (Guarded by custom automated pytest: test_production_workloads_no_latest_tag)
  - CKV_K8S_15 # IfNotPresent is required for locally built immutable tags in the single-node lab
  - CKV_K8S_35 # SecretKeyRef environment injection is the documented application configuration contract
  - CKV_K8S_23 # Fluent Bit and Falco collector processes require root for host log/kernel collection

  # --- Docker image maintenance ---
  - CKV_DOCKER_9 # Runtime stages apply apt security updates and remove package lists; APT is not used by application code

  # --- Probes and Limits on Third-Party Support Components ---
  - CKV_K8S_8  # Liveness probe should be configured (Configured on edge-api; daemonsets use daemon health)
  - CKV_K8S_9  # Readiness probe should be configured (Configured on edge-api; daemonsets use daemon health)
