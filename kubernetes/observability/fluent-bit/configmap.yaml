apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: kubesentinel
    app.kubernetes.io/component: telemetry-collector
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf
        Daemon        off

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Mem_Buf_Limit     15MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Buffer_Size         64KB

    [FILTER]
        Name         parser
        Match        kube.*edge*
        Key_Name     log
        Parser       json
        Reserve_Data On

    [FILTER]
        Name         parser
        Match        kube.*falco*
        Key_Name     log
        Parser       json
        Reserve_Data On

    [OUTPUT]
        Name                  es
        Match                 *falco*
        Host                  elasticsearch.observability.svc.cluster.local
        Port                  9200
        HTTP_User             ${ES_USER}
        HTTP_Passwd           ${ES_PASSWORD}
        Logstash_Format       On
        Logstash_Prefix       kubesentinel-falco
        Logstash_DateFormat   %Y.%m.%d
        Type                  _doc
        Retry_Limit           5
        Buffer_Size           10MB
        Replace_Dots          On
        Suppress_Type_Name    On

    [OUTPUT]
        Name                  es
        Match                 *edge*
        Host                  elasticsearch.observability.svc.cluster.local
        Port                  9200
        HTTP_User             ${ES_USER}
        HTTP_Passwd           ${ES_PASSWORD}
        Logstash_Format       On
        Logstash_Prefix       kubesentinel-app
        Logstash_DateFormat   %Y.%m.%d
        Type                  _doc
        Retry_Limit           5
        Buffer_Size           10MB
        Replace_Dots          On
        Suppress_Type_Name    On

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<_p>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        json
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On
