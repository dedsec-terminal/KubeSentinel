apiVersion: v1
kind: PersistentVolume
metadata:
  name: fluent-bit-varlog
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: kubesentinel
    app.kubernetes.io/component: telemetry-collector
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 1Gi
  storageClassName: manual
  hostPath:
    path: /var/log
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluent-bit-varlog
  namespace: observability
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: kubesentinel
    app.kubernetes.io/component: telemetry-collector
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: manual
  volumeName: fluent-bit-varlog
  resources:
    requests:
      storage: 1Gi
