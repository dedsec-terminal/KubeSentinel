name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday automated security audit

permissions:
  contents: read

jobs:
  trivy-filesystem-and-iac-scan:
    name: Trivy Filesystem & IaC Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trivy filesystem vulnerability and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          skip-dirs: "tests/kyverno,simulations/insecure_deployment/fixtures,kubernetes/security"
          exit-code: "1"

      - name: Trivy IaC configuration scan (Kubernetes manifests, Dockerfiles, Helm values)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore"
          skip-dirs: "tests/kyverno,simulations/insecure_deployment/fixtures,kubernetes/security"
          exit-code: "1"

  checkov-iac-scan:
    name: Checkov Infrastructure-as-Code Static Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkov IaC scan across Kubernetes, Dockerfile, Helm, and GitHub Actions
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12.3123.0
        with:
          config_file: ".checkov.yaml"
          framework: "all"
          output_format: "cli"
          soft_fail: false

  trivy-container-image-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build local application container images
        run: |
          docker build -t kubesentinel/edge-api:1.0.0 -f apps/edge-api/Dockerfile .
          docker build -t kubesentinel/edge-worker:1.0.0 -f apps/edge-worker/Dockerfile .

      - name: Trivy scan edge-api container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "kubesentinel/edge-api:1.0.0"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      - name: Trivy scan edge-worker container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "kubesentinel/edge-worker:1.0.0"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

  sbom-artifacts:
    name: Generate SBOM Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Set up Trivy for image SBOM generation
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Build versioned images and generate CycloneDX SBOMs
        run: |
          python scripts/kubesentinel.py sbom --build --tag 1.0.0 --format cyclonedx --output-dir artifacts/sbom/cyclonedx

      - name: Generate SPDX SBOMs from the same images
        run: |
          python scripts/kubesentinel.py sbom --tag 1.0.0 --format spdx-json --output-dir artifacts/sbom/spdx

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubesentinel-sbom-${{ github.sha }}
          path: artifacts/sbom/
          if-no-files-found: error
          retention-days: 30
